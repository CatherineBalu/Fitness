# Run MR pipelines on every push to an open MR; branch pipelines only on devel/main.
# Without this, branch pipelines and MR pipelines would both be created, causing
# "duplicate pipeline" conflicts and blocking the MR pipeline from running.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "devel"

# 1. Define the stages of the pipeline
stages:
  - lint_and_format
  - test

# ==========================================
# FRONTEND JOBS (Uses Node.js)
# ==========================================

frontend:lint:
  stage: lint_and_format
  image: node:20-alpine # Uses a lightweight Node environment
  tags:
    - shared-fi
  script:
    - cd frontend
    - npm ci # Strictly installs dependencies exactly as they are in package-lock.json
    - npm run format:check # Checks Prettier
    - npm run lint # Runs ESLint

frontend:test:
  stage: test
  image: node:20-alpine
  tags:
    - shared-fi
  script:
    - cd frontend
    - npm ci
    - npm run test # Runs your frontend tests (e.g., Vitest)

# ==========================================
# BACKEND JOBS (Uses Bun)
# ==========================================

backend:lint:
  stage: lint_and_format
  image: oven/bun:latest # Uses the official Bun environment
  tags:
    - shared-fi
  script:
    - cd backend
    - bun install # Installs Bun dependencies
    - bun run format:check 
    - bun run lint 

backend:test:
  stage: test
  image: oven/bun:latest
  tags:
    - shared-fi
  script:
    - cd backend
    - bun install
    - bun test # Built-in test runner for Bun

# ==========================================
# E2E JOBS (Playwright — runs in MR pipelines only)
# ==========================================

e2e:test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.59.1-jammy
  tags:
    - shared-fi
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: fitness
    POSTGRES_USER: fitness
    POSTGRES_PASSWORD: fitness
    DATABASE_URL: "postgres://fitness:fitness@postgres:5432/fitness"
    CI: "true"
    # E2E_TEST_EMAIL, E2E_TEST_PASSWORD, CLERK_SECRET_KEY, VITE_CLERK_PUBLISHABLE_KEY,
    # FRONTEND_URL and VITE_API_URL must be defined as protected CI/CD variables
    # in the GitLab project settings.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "devel"
      when: manual
      allow_failure: true
  before_script:
    - apt-get update -qq && apt-get install -y unzip
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
    - npm ci
    - (cd frontend && npm ci)
    - (cd backend && bun install)
    - (cd backend && bunx drizzle-kit push && bun run src/db/seed.ts)
  script:
    - npx playwright test
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 week